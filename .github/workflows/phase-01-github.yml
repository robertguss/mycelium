name: Phase 01 GitHub

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  github-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Credentialed publish tests
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "skipped: no credentials"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "skipped: no credentials"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh auth status; then
            echo "skipped: no credentials"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          go test -tags=github_integration ./internal/publish/ -count=1 -v
      - name: Cleanup fixture repos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set +e
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "skipped: no credentials"
            exit 0
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "skipped: no credentials"
            exit 0
          fi
          if ! gh auth status; then
            echo "skipped: no credentials"
            exit 0
          fi
          login="$(gh api user --jq .login 2>/dev/null)" || exit 0
          repos="$(gh repo list "$login" --limit 200 --json name --jq '.[].name' 2>/dev/null)" || exit 0
          for name in $repos; do
            case "$name" in
              mycelium-ms101-*)
                echo "deleting $login/$name"
                gh repo delete "$login/$name" --yes || true
                ;;
            esac
          done
